# 로컬(Rocky Linux WSL2)에서 워커 4개를 띄우는 compose 파일.
# (원래 10개였으나, 개발서버(CentOS7, 운영 서비스와 자원 공유)에 배포했을 때
#  LibreOffice 10개 동시 구동으로 부하가 몰려 SSH까지 끊기는 문제가 있어 4개로
#  낮췄다 — 로컬/서버 설정을 일치시키기 위해 이 기본값도 같이 낮춤.)
# Windows 쪽 Node 서버(server.js)에서는
# HWP_WORKER_URLS=http://localhost:4101,http://localhost:4102,http://localhost:4103,http://localhost:4104
# 로 접근하면 된다 (WSL2의 localhost 포워딩 덕분에 Windows에서 바로 접근 가능).
services:
  hwp-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4101:4100"

  hwp-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4102:4100"

  hwp-worker-3:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4103:4100"

  hwp-worker-4:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4104:4100"
